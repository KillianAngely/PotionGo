name: PR Build

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./app/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Format code
        run: npm run test:static

      - name: Build
        run: npm run build

      - name: Check build artifacts
        run: |
          if [ ! -d ".next" ]; then
            echo "Build failed - ./app/.next directory not found"
            exit 1
          fi
          echo "Build successful - ./app/.next directory created"
