name: Android PR

on:
  pull_request:
    paths:
      - "app/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./app

    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: |
            app/**/*.gradle*
            app/**/*.gradle.kts
            app/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Gradle
